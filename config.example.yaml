# Copie vers config.yaml. Le mode démo garantit un premier rendu immédiat.
demo: true

paper:
  title: "Signal Matin"
  subtitle: "Le journal anti-scroll"
  motto: "Voir clair avant de voir l'écran."
  density: "auto"   # auto, compact (~5 pages), standard ou extended

modules:
  weather: true
  calendar: true
  tasks: true
  news: true
  tech: true
  rss: true
  games: true
  tech_vocabulary: true
  recommendations: true
  sport: false            # page Sport + encadré « A suivre » en une
  markets: false          # bandeau des cours en une + page Marchés
  ai: false               # édito et résumés rédigés par Claude (clé ANTHROPIC_API_KEY)
  mail: false             # mails non lus (IMAP, lecture seule), triés par Claude si ai est actif

weather:
  location: ""
  latitude: null
  longitude: null

calendar:
  ics: []
  # - name: "Agenda personnel"
  #   source: "calendars/agenda.ics" # chemin local ou URL privée placée seulement ici
  # - name: "Google Agenda"
  #   source: "${GOOGLE_ICS_URL}"   # adresse secrète iCal, gardée dans .env
  google:
    enabled: false
    calendar_id: "primary"
    credentials_file: "${GOOGLE_CREDENTIALS_FILE}"
    token_file: "${GOOGLE_TOKEN_FILE}"

tasks:
  priorities: []
  # - title: "Finaliser le dossier"
  #   importance: "high"
  reminders: []

news:
  limit: 12
  max_age_hours: 72
  feeds: []
  # - name: "Nom du média"
  #   category: "Monde"
  #   url: "https://exemple.org/rss.xml"

tech:
  limit: 6
  max_age_hours: 96
  feeds: []

# Sport (données publiques ESPN, sans clé). Chaque discipline est facultative.
sport:
  timezone: "Europe/Paris"
  tennis:
    tours: ["atp", "wta"]
    top: 20                 # matchs du jour impliquant un joueur du top 20
  football:
    leagues:
      - code: "uefa.champions"   # autres codes : fra.1, eng.1, esp.1, ita.1, ger.1...
        name: "Ligue des champions"
        table: "match_days"      # classement les jours de match ; "never" pour le masquer
  nba:
    team: "SA"                    # abréviation ESPN de l'équipe suivie
    team_timezone: "America/Chicago"
    recap_all_games: false        # true : résumé de tous les matchs de la nuit
    standings_weekday: 6          # 0 = lundi ... 6 = dimanche

# Marchés (Yahoo Finance + agenda ForexFactory, sans clé, données différées).
markets:
  timezone: "Europe/Paris"
  # quotes: remplace la liste par défaut (CAC 40, S&P 500, EUR/USD, or, Brent,
  # Bitcoin, Ethereum, BNB). Symboles Yahoo Finance.
  # quotes:
  #   - {symbol: "^FCHI", name: "CAC 40"}
  #   - {symbol: "EURUSD=X", name: "EUR/USD", decimals: 4}
  #   - {symbol: "BTC-USD", name: "Bitcoin", unit: "$", crypto: true}
  movers:
    cac40: true             # hausses/baisses de la veille parmi les valeurs du CAC 40
    us: true                # palmarès américain de Yahoo Finance
    count: 5
  macro:
    enabled: true
    countries: ["USD", "EUR"]
    impact: ["High", "Medium"]

# Mails non lus des dernières 24 h, en lecture seule (rien n'est marqué comme lu).
# Avec Gmail, le mot de passe d'application de l'envoi suffit. Si le module ai est
# actif, le texte des mails est transmis à Claude pour être trié.
mail:
  imap_host: "imap.gmail.com"
  username: "${SMTP_USERNAME}"
  password: "${SMTP_PASSWORD}"
  query: "is:unread newer_than:1d category:primary"   # recherche Gmail
  limit: 25

# Rédaction par Claude (extra [ai] : pip install -e ".[ai]"). Claude ne reçoit que
# les titres et extraits de l'édition et n'ajoute aucun fait. Coût indicatif avec
# claude-opus-5-5 : quelques centimes par jour.
ai:
  model: "claude-opus-5-5"
  effort: "medium"          # low, medium, high
  tone: "complice"          # complice (tutoiement), serieux, concis
  reader: "son lecteur"     # ex. « Mike, qui vit à Cluny »

recommendations: []
personal:
  greeting: "Bonjour."
  note: ""
  free_window: ""
  quote:
    text: ""
    author: ""

printing:
  printer: ""
  duplex: false

# Envoi par email : impression à distance (HP ePrint, Epson Connect...) et/ou
# copie dans ta boîte. Activé avec : signal-matin generate --email
# Les identifiants restent dans .env (SMTP_USERNAME, SMTP_PASSWORD).
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587            # 587 = STARTTLS, 465 = SSL
  username: "${SMTP_USERNAME}"
  password: "${SMTP_PASSWORD}"
  from: "${SMTP_USERNAME}"
  printer_to: []            # ex. ["xxxx@hpeprint.com"] : reçoit uniquement le PDF
  copy_to: []               # ex. ["moi@example.org"] : PDF + petit message
  alert_to: []              # en cas d'échec ; vide = même chose que copy_to
